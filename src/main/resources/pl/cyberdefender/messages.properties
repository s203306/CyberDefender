# =====================================================
# Instrukcja (instructions.fxml)
# =====================================================
instructions.title=Instrukcja

instructions.section.goal.title=Cel gry i rola gracza
instructions.section.goal.text=Gracz pełni rolę administratora bezpieczeństwa małej firmy. Nadzoruje sieć, analizuje \
  alerty i wybiera działania, zanim incydent przerodzi się w poważną awarię. Celem gry jest zabezpieczenie sieci firmy \
  i uchronienie bazy danych przed wrogim przejęciem.

instructions.section.round.title=Przebieg rundy
instructions.section.round.text=Gra działa na podstawie rund – jedna runda to jeden dzień pracy. Podczas rundy gracz \
  może wykonać kilka akcji, a ich liczba jest ograniczona pulą akcji na rundę.
instructions.round.order=Kolejność działania:
instructions.round.step1=1. Gracz obserwuje mapę sieci i czyta alerty w Centrum incydentów.
instructions.round.step2=2. Gracz wykonuje akcje.
instructions.round.step3=3. Gracz kończy rundę.
instructions.round.after=Po końcu rundy zachodzą zdarzenia zaplanowane w scenariuszu, malware próbuje przedostać się \
  dalej, a gra sprawdza warunki końca.

instructions.section.status.title=Statusy urządzeń
instructions.section.status.text=Statusy urządzeń to informacja, którą posiada gracz, a nie to, co dzieje się \
  naprawdę z urządzeniem.
instructions.status.unknown=○ (szary) Brak danych – nic nie sprawdzono.
instructions.status.suspicious=⚠ (żółty) Podejrzane – alert bezpieczeństwa lub dziwne logi.
instructions.status.clean=✔ (niebieski) Czyste – skan niczego nie wykrył.
instructions.status.infected=✖ (czerwony) Zainfekowane – skan potwierdził malware.
instructions.marker.isolated=(przerywana ramka) Odizolowane – urządzenie odłączone od sieci, nie pracuje (ale atak \
  nie przejdzie dalej).
instructions.marker.inRepair=↻ W naprawie – trwa przywracanie urządzenia (trwa 1 rundę).
instructions.marker.accountBlocked=🔒 Konto zablokowane – nikt nie może zalogować się na to konto.
instructions.marker.critical=★ Krytyczne – router, serwer i baza danych; ich utrata najbardziej szkodzi firmie.

instructions.section.actions.title=Akcje gracza
instructions.action.viewLogs=Sprawdź logi – wskazówka: może zmienić status na Podejrzane albo wyjaśnić fałszywy \
  alarm. Dostępne zawsze, poza urządzeniem w naprawie (koszt: wkrótce).
instructions.action.scan=Skanuj – pewna odpowiedź: Czyste albo Zainfekowane. Dostępne zawsze, poza urządzeniem \
  w naprawie (koszt: wkrótce).
instructions.action.isolate=Izoluj – zatrzymuje rozprzestrzenianie się zagrożenia, ale wyłącza urządzenie. Dostępne \
  dla nieizolowanych urządzeń (koszt: wkrótce).
instructions.action.blockAccount=Zablokuj konto – zatrzymuje atakującego, który ukradł hasło. Dostępne na \
  urządzeniach z niezablokowanym kontem (koszt: wkrótce).
instructions.action.restore=Przywróć – czyści urządzenie i po 1 rundzie podłącza je z powrotem do sieci. Dostępne \
  tylko dla odizolowanego urządzenia (koszt: wkrótce).

instructions.section.resources.title=Zasoby
instructions.resources.budget=Budżet (np. 20) – pieniądze na całą misję; każda akcja ma swój koszt.
instructions.resources.actionsPerRound=Akcje na rundę (np. 3) – czas zespołu w ciągu dnia; odnawiają się co rundę.
instructions.resources.roundLimit=Limit rund (np. 10) – liczba dni na opanowanie incydentu.

instructions.section.end.title=Warunki zakończenia
instructions.end.databaseLost=Porażka (natychmiastowa): zagrożenie dociera do bazy danych, a dane firmy zostają \
  przejęte.
instructions.end.success=Sukces (opanowanie incydentu): każde zainfekowane urządzenie jest odizolowane albo \
  przywrócone, a przejęte konta są zablokowane, zanim minie limit rund.
instructions.end.partialSuccess=Częściowy sukces: zagrożenie zostało opanowane, ale w trakcie rozgrywki infekcja \
  doszła do serwera.
instructions.end.timeout=Porażka: minął limit rund, a zagrożenie jest dalej aktywne.
instructions.end.noBudget=Brak budżetu: sam brak pieniędzy nie kończy gry – dalej można kończyć rundy, ale bez \
  wykonywania akcji.

